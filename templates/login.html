<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Biblioteca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  </head>
  <body>
    <div class="container">
      <div class="card">

        <div style="display: flex; justify-content: center; margin-bottom: 25px;">
          <img src="{{ url_for('static', filename='img/logo_biblioteca.svg') }}"
               alt="Sistema de Biblioteca"
               style="height: 90px; width: auto;">
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" style="
                margin-bottom: 15px;
                padding: 10px 14px;
                border-radius: 6px;
                font-size: 0.9rem;
                font-weight: 500;
                background-color: {% if category == 'danger' %}#fde8e8{% elif category == 'success' %}#e6f9ec{% else %}#fff8e1{% endif %};
                color: {% if category == 'danger' %}#c0392b{% elif category == 'success' %}#27ae60{% else %}#856404{% endif %};
                border: 1px solid {% if category == 'danger' %}#f5c6cb{% elif category == 'success' %}#b2dfdb{% else %}#ffeeba{% endif %};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <input type="email" name="correo" placeholder="Correo electrónico" required />
          <input type="password" name="password" placeholder="Contraseña" required />
          <button type="submit">Iniciar sesión</button>
        </form>

        <div class="links">
          <a href="{{ url_for('register') }}">Registrarse</a>
          <a href="{{ url_for('forgot_password') }}">Olvidé mi contraseña</a>
        </div>
      </div>
    </div>
  </body>
</html>
